<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CERVENKA28 PORTAL</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
        url("background.jpg") center/cover no-repeat;
}

.profile {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 35px;
    background: rgba(15,15,15,0.85);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 18px;
    transition: 0.3s;
    backdrop-filter: blur(12px);
}

.logo img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.logo:hover {
    transform: scale(1.08);
    background: rgba(40,40,40,0.95);
}

.portal {
    position: absolute;
    bottom: 18px;
    right: 22px;
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="profile">
    <a class="logo"
       href="https://guns.lol/cervenka28"
       target="_blank"
       rel="noopener noreferrer">

       <img src="https://guns.lol/favicon.ico" alt="guns.lol">
    </a>
</div>

<div class="portal">
    CERVENKA28 PORTAL
</div>

</body>
</html>
